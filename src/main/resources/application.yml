# Continuum backend — configuration technique par environnement (properties/env).
# RAPPEL (CLAUDE.md) : aucune constante metier ici. Ce qui peut differer POUR UNE
# RAISON METIER se parametre en base, par tenant, sans redeploiement.

spring:
  application:
    name: continuum-backend

  # Migrations executees par continuum-migrator, jamais au demarrage (D33, §4.3.5).
  flyway:
    enabled: false

  # Placeholders — la source de donnees reelle est resolue par tenant (§4.7).
  datasource:
    url: ${CONTINUUM_DB_URL:jdbc:postgresql://localhost:5432/continuum}
    username: ${CONTINUUM_DB_USER:continuum_app}
    password: ${CONTINUUM_DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  # Erreurs en RFC 9457 application/problem+json (contrat D32) ; traceId ajoute par ProblemDetailAdvice.
  mvc:
    problemdetails:
      enabled: true

  # Arret progressif (SIGTERM) : les requetes en cours se terminent avant l'arret (deploiements container).
  lifecycle:
    timeout-per-shutdown-phase: 20s

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak — service d'authentification separe (§4.5).
          issuer-uri: ${CONTINUUM_OIDC_ISSUER_URI:http://localhost:8080/realms/banque-demo}

# Profil de deploiement : all | app | admin | worker (§4.3.2).
continuum:
  cors:
    # Origines des fronts autorisees (liste separee par des virgules). Dev : app-web :4201, admin-web :4202.
    allowed-origins: ${CONTINUUM_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:4201,http://localhost:4202}
  internal:
    # Client Keycloak (compte de service) autorise a appeler /internal/** (client credentials).
    client-id: ${CONTINUUM_INTERNAL_CLIENT_ID:continuum-keycloak}
  keycloak:
    # Client d'administration Keycloak (reset-mfa, close-sessions) ; base-url vide = fonction indisponible (503).
    admin:
      base-url: ${CONTINUUM_KC_ADMIN_BASE_URL:}
      realm: ${CONTINUUM_KC_ADMIN_REALM:banque-demo}
      client-id: ${CONTINUUM_KC_ADMIN_CLIENT_ID:continuum-admin-service}
      client-secret: ${KC_ADMIN_SERVICE_SECRET:}
  # Synchronisation annuaire (Keycloak user-storage, admin REST). Desactivee par defaut ; source-code = nom du composant
  # user-storage Keycloak. Client dedie a moindre privilege (sinon repli sur keycloak.admin).
  directory-sync:
    enabled: ${CONTINUUM_DIRECTORY_SYNC_ENABLED:false}
    source-code: ${CONTINUUM_DIRECTORY_SYNC_SOURCE:}
    interval: ${CONTINUUM_DIRECTORY_SYNC_INTERVAL:PT1H}
    initial-delay: ${CONTINUUM_DIRECTORY_SYNC_INITIAL_DELAY:PT1M}
    client-id: ${CONTINUUM_DIRECTORY_SYNC_CLIENT_ID:}
    client-secret: ${CONTINUUM_DIRECTORY_SYNC_CLIENT_SECRET:}
  auth:
    bff:
      # BFF d'authentification (ADR 0014) : actif seulement si la cle de chiffrement des refresh tokens est fournie (Vault).
      encryption-key: ${CONTINUUM_AUTH_BFF_ENCRYPTION_KEY:}
      cookie-secure: ${CONTINUUM_AUTH_BFF_COOKIE_SECURE:true}
      # Redirection (Code + PKCE termine par le BFF) : endpoint d'autorisation visible du navigateur et URL du callback
      # (vides = derives de l'issuer et de la requete).
      auth-uri: ${CONTINUUM_AUTH_BFF_AUTH_URI:}
      callback-uri: ${CONTINUUM_AUTH_BFF_CALLBACK_URI:}
      apps:
        app:
          client-id: ${CONTINUUM_AUTH_BFF_APP_CLIENT_ID:continuum-app-bff}
          client-secret: ${KC_APP_BFF_SECRET:}
        admin:
          client-id: ${CONTINUUM_AUTH_BFF_ADMIN_CLIENT_ID:continuum-admin-bff}
          client-secret: ${KC_ADMIN_BFF_SECRET:}
  surface: ${CONTINUUM_SURFACE:all}
  db:
    # Dialecte du moteur d'autorisation (D4) : postgresql | oracle.
    dialect: ${CONTINUUM_DB_DIALECT:postgresql}
  audittrail:
    # Cle HMAC de signature du journal d'audit (§2.3) — a fournir via Vault (§4), jamais en dur.
    hmac-key: ${CONTINUUM_AUDITTRAIL_HMAC_KEY:}

# Logs JSON ECS, stdout uniquement (§10).
logging:
  structured:
    format:
      console: ecs

# Arret progressif active au niveau serveur (couple a spring.lifecycle ci-dessus).
server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # Groupes de sondes conteneur : /actuator/health/liveness et /actuator/health/readiness.
      probes:
        enabled: true
