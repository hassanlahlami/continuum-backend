openapi: 3.1.0
info:
  title: Continuum — Admin Système — intégrations, configuration, exploitation, observabilité
  version: 0.1.0
  x-status: draft
  description: |
    Pages OPS-01 à OPS-16 : connecteurs ERP, prestataires de signature, packs et promotion de configuration, thème, workflows (déploiements, instances), caches (§4.3.4), logs, traces, erreurs et alertes (§10), supervision, journal d'audit, exports, reprise de données, licence et accès de support, services IA. Actions sensibles : motif obligatoire (champ comment) et authentification renforcée (acr ≥ 2).
servers:
  - url: /api/admin
security:
  - bearer: []
tags:
  - name: connectors
  - name: signature-providers
  - name: packs
  - name: theme
  - name: workflows
  - name: caches
  - name: logs
  - name: alerts
  - name: health
  - name: audit-trail
  - name: exports
  - name: imports
  - name: retention
  - name: license
  - name: ai
paths:
  /connectors:
    get:
      tags:
        - connectors
      operationId: listConnectors
      summary: Connecteurs ERP/CBS et leur santé (état du circuit breaker, dernière exécution)
      x-required-feature: ops.connector.read
      responses:
        '200':
          description: Connecteurs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connector'
    post:
      tags:
        - connectors
      operationId: createConnector
      summary: Déclarer un connecteur (type, endpoint, référence de secret Vault — jamais le secret)
      x-required-feature: ops.connector.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorInput'
      responses:
        '201':
          description: Connecteur créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connector'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /connectors/{connectorId}:
    parameters:
      - $ref: '#/components/parameters/ConnectorId'
    get:
      tags:
        - connectors
      operationId: getConnector
      summary: Configuration d'un connecteur
      x-required-feature: ops.connector.read
      responses:
        '200':
          description: Connecteur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connector'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - connectors
      operationId: updateConnector
      summary: Modifier la configuration d'un connecteur
      x-required-feature: ops.connector.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorInput'
      responses:
        '200':
          description: Connecteur à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connector'
        '409':
          $ref: '#/components/responses/Conflict'
  /connectors/{connectorId}/actions/{actionCode}:
    post:
      tags:
        - connectors
      operationId: performConnectorAction
      summary: Tester la connexion, activer, désactiver, réinitialiser le circuit breaker
      x-required-feature: ops.connector.manage
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
        - $ref: '#/components/parameters/ActionCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: Résultat (connecteur à jour, résultat du test).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connector'
  /connectors/{connectorId}/mapping:
    parameters:
      - $ref: '#/components/parameters/ConnectorId'
    get:
      tags:
        - connectors
      operationId: getConnectorMapping
      summary: Correspondance des champs source vers le modèle canonique
      x-required-feature: ops.connector.read
      responses:
        '200':
          description: Mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorMapping'
    put:
      tags:
        - connectors
      operationId: updateConnectorMapping
      summary: Modifier le mapping (validé sur un échantillon avant enregistrement)
      x-required-feature: ops.connector.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorMapping'
      responses:
        '200':
          description: Mapping enregistré.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorMapping'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /connectors/{connectorId}/executions:
    get:
      tags:
        - connectors
      operationId: listConnectorExecutions
      summary: Journal d'exécution (appels, durée, statut, volumes — jamais les données)
      x-required-feature: ops.connector.read
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Exécutions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorExecutionPage'
  /canonical-model:
    get:
      tags:
        - connectors
      operationId: getCanonicalModel
      summary: Modèle canonique en vigueur — entités et champs **déclarés par le pack sectoriel installé** (§6.2, D35)
      x-required-feature: ops.connector.read
      responses:
        '200':
          description: Entités canoniques et leurs champs.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - entity
                    - fields
                  properties:
                    entity:
                      type: string
                      example: MOVEMENT
                    label:
                      type: string
                      example: Mouvement comptable
                    packCode:
                      type: string
                      example: PACK-BANQUE
                    fields:
                      type: array
                      items:
                        type: object
                        required:
                          - name
                          - type
                        properties:
                          name:
                            type: string
                            example: booking_date
                          label:
                            type: string
                          type:
                            type: string
                            enum:
                              - STRING
                              - NUMBER
                              - MONEY
                              - DATE
                              - DATETIME
                              - BOOLEAN
                          required:
                            type: boolean
                          sensitive:
                            type: boolean
  /signature-providers:
    get:
      tags:
        - signature-providers
      operationId: listSignatureProviders
      summary: Prestataires de signature (interne, PKI, prestataires externes)
      x-required-feature: ops.signature-provider.manage
      responses:
        '200':
          description: Prestataires.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SignatureProvider'
    post:
      tags:
        - signature-providers
      operationId: createSignatureProvider
      summary: Déclarer un prestataire de signature
      x-required-feature: ops.signature-provider.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureProvider'
      responses:
        '201':
          description: Prestataire créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureProvider'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /signature-providers/{providerId}:
    put:
      tags:
        - signature-providers
      operationId: updateSignatureProvider
      summary: Modifier un prestataire de signature
      x-required-feature: ops.signature-provider.manage
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureProvider'
      responses:
        '200':
          description: Prestataire à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureProvider'
        '409':
          $ref: '#/components/responses/Conflict'
  /packs:
    get:
      tags:
        - packs
      operationId: listPacks
      summary: Packs de conformité installés et disponibles (versions)
      x-required-feature: ops.pack.manage
      responses:
        '200':
          description: Packs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pack'
  /packs/{packCode}/actions/{actionCode}:
    post:
      tags:
        - packs
      operationId: performPackAction
      summary: Installer ou mettre à jour un pack (aperçu des changements, puis application) — opération longue
      x-required-feature: ops.pack.manage
      parameters:
        - name: packCode
          in: path
          required: true
          schema:
            type: string
            example: PACK-BANQUE
        - $ref: '#/components/parameters/ActionCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '202':
          $ref: '#/components/responses/JobAccepted'
        '409':
          $ref: '#/components/responses/Conflict'
  /configuration-exports:
    post:
      tags:
        - packs
      operationId: exportConfiguration
      summary: Exporter le paramétrage d'une entité (JSON signé, versionné) pour promotion recette → production
      x-required-feature: ops.config.transfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - entityId
              properties:
                entityId:
                  $ref: '#/components/schemas/Id'
                sections:
                  type: array
                  items:
                    type: string
                    enum:
                      - ORG
                      - POSITIONS
                      - ROLES
                      - REFERENTIALS
                      - WORKFLOWS
                      - SIGNATURE_POLICIES
                      - THEME
                      - LABELS
                      - CCM_SETTINGS
      responses:
        '202':
          $ref: '#/components/responses/JobAccepted'
  /configuration-imports:
    post:
      tags:
        - packs
      operationId: importConfiguration
      summary: Importer un paramétrage exporté — produit un aperçu des différences, rien n'est appliqué
      x-required-feature: ops.config.transfer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - entityId
              properties:
                file:
                  type: string
                  contentEncoding: binary
                entityId:
                  $ref: '#/components/schemas/Id'
      responses:
        '202':
          $ref: '#/components/responses/JobAccepted'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /configuration-imports/{importId}/actions/{actionCode}:
    post:
      tags:
        - packs
      operationId: performConfigurationImportAction
      summary: Appliquer ou abandonner un import de paramétrage (après lecture de l'aperçu)
      x-required-feature: ops.config.transfer
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/ActionCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '202':
          $ref: '#/components/responses/JobAccepted'
        '409':
          $ref: '#/components/responses/Conflict'
  /theme:
    get:
      tags:
        - theme
      operationId: getThemeDraft
      summary: Thème de l'entité (brouillon courant, version publiée, rapport WCAG)
      x-required-feature: ops.theme.manage
      parameters:
        - $ref: '#/components/parameters/EntityQuery'
      responses:
        '200':
          description: Thème.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Theme'
    put:
      tags:
        - theme
      operationId: updateThemeDraft
      summary: Modifier le brouillon (tokens DTCG validés par schéma ; pas de CSS libre, §1.6.4)
      x-required-feature: ops.theme.manage
      parameters:
        - $ref: '#/components/parameters/EntityQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
                - tokens
              properties:
                version:
                  type: integer
                presetCode:
                  type: string
                  example: institutionnel
                tokens:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Brouillon enregistré, rapport WCAG recalculé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Theme'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /theme/actions/{actionCode}:
    post:
      tags:
        - theme
      operationId: performThemeAction
      summary: Créer un lien d'aperçu, publier (refusé si non conforme WCAG), revenir à une version
      x-required-feature: ops.theme.manage
      parameters:
        - $ref: '#/components/parameters/EntityQuery'
        - $ref: '#/components/parameters/ActionCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: Thème à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Theme'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /theme/assets:
    get:
      tags:
        - theme
      operationId: listThemeAssets
      summary: Logos, favicon, polices, images de l'entité
      x-required-feature: ops.theme.manage
      parameters:
        - $ref: '#/components/parameters/EntityQuery'
      responses:
        '200':
          description: Ressources.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ThemeAsset'
    post:
      tags:
        - theme
      operationId: uploadThemeAsset
      summary: Déposer une ressource graphique (licence obligatoire pour une police)
      x-required-feature: ops.theme.manage
      parameters:
        - $ref: '#/components/parameters/EntityQuery'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - kind
              properties:
                file:
                  type: string
                  contentEncoding: binary
                kind:
                  type: string
                  enum:
                    - LOGO
                    - LOGO_DARK
                    - LOGO_SMALL
                    - FAVICON
                    - LOGIN_IMAGE
                    - FONT
                    - REPORT_HEADER
                licenseNote:
                  type: string
      responses:
        '201':
          description: Ressource déposée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeAsset'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /workflow/deployments:
    get:
      tags:
        - workflows
      operationId: listWorkflowDeployments
      summary: Définitions BPMN/DMN déployées et publications en attente
      x-required-feature: ops.workflow.deploy
      responses:
        '200':
          description: Déploiements.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowDeployment'
    post:
      tags:
        - workflows
      operationId: submitWorkflowDeployment
      summary: Soumettre un BPMN ou une DMN (lint §6.2.5 exécuté, publication en maker-checker)
      x-required-feature: ops.workflow.deploy
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - entityId
              properties:
                file:
                  type: string
                  contentEncoding: binary
                entityId:
                  $ref: '#/components/schemas/Id'
      responses:
        '201':
          description: Soumission enregistrée avec son rapport de lint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDeployment'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /workflow/deployments/{deploymentId}/actions/{actionCode}:
    post:
      tags:
        - workflows
      operationId: performWorkflowDeploymentAction
      summary: Simuler, approuver (déployer) ou rejeter une définition — interdit à son auteur
      x-required-feature: ops.workflow.deploy
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/ActionCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: Déploiement à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDeployment'
        '403':
          $ref: '#/components/responses/Forbidden'
  /workflow/instances:
    get:
      tags:
        - workflows
      operationId: listWorkflowInstances
      summary: Instances de processus (filtre sur incidents, tâches sans candidat, minuteurs en retard)
      x-required-feature: ops.workflow.operate
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: processKey
          in: query
          schema:
            type: string
        - name: problem
          in: query
          schema:
            type: string
            enum:
              - INCIDENT
              - NO_CANDIDATE
              - TIMER_LATE
      responses:
        '200':
          description: Instances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowInstancePage'
  /workflow/instances/{instanceId}/actions/{actionCode}:
    post:
      tags:
        - workflows
      operationId: performWorkflowInstanceAction
      summary: Relancer une étape en incident, migrer vers une autre version (plan de correspondance)
      x-required-feature: ops.workflow.operate
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/ActionCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: Instance à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowInstance'
        '409':
          $ref: '#/components/responses/Conflict'
  /caches:
    get:
      tags:
        - caches
      operationId: listCaches
      summary: Régions de cache Ehcache (entrées, mémoire, taux de succès, dernière purge, état par instance)
      x-required-feature: admin.cache.read
      responses:
        '200':
          description: Régions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CacheRegion'
    delete:
      tags:
        - caches
      operationId: evictCaches
      summary: Purger toutes les régions — d'une entité (admin.cache.evict) ou de toute l'installation (admin.cache.evict.all)
      x-required-feature:
        - admin.cache.evict
        - admin.cache.evict.all
      parameters:
        - name: entityId
          in: query
          description: Absent = purge globale (admin.cache.evict.all, realm opérateur, acr=2).
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/Reason'
      responses:
        '200':
          description: Purge diffusée ; accusés par instance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvictionResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /caches/{region}:
    delete:
      tags:
        - caches
      operationId: evictCacheRegion
      summary: Purger une région, éventuellement limitée à une entité ou à une entrée
      x-required-feature: admin.cache.evict
      parameters:
        - name: region
          in: path
          required: true
          schema:
            type: string
            example: iam-structure
        - name: entityId
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: key
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Reason'
      responses:
        '200':
          description: Purge diffusée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvictionResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /caches/warmup:
    post:
      tags:
        - caches
      operationId: warmupCaches
      summary: Précharger les paramétrages d'une entité
      x-required-feature: admin.cache.evict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - entityId
              properties:
                entityId:
                  $ref: '#/components/schemas/Id'
      responses:
        '202':
          $ref: '#/components/responses/JobAccepted'
  /logs/search:
    post:
      tags:
        - logs
      operationId: searchLogs
      summary: Rechercher dans les logs techniques ou de sécurité (§10.8) — la consultation est journalisée
      x-required-feature:
        - admin.logs.tech.read
        - admin.logs.security.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogQuery'
      responses:
        '200':
          description: Résultats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogResultPage'
        '403':
          $ref: '#/components/responses/Forbidden'
  /logs/saved-queries:
    get:
      tags:
        - logs
      operationId: listSavedLogQueries
      summary: Requêtes de logs sauvegardées
      x-required-feature:
        - admin.logs.tech.read
        - admin.logs.security.read
      responses:
        '200':
          description: Requêtes.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      $ref: '#/components/schemas/Id'
                    label:
                      type: string
                    query:
                      $ref: '#/components/schemas/LogQuery'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - logs
      operationId: saveLogQuery
      summary: Sauvegarder une requête de logs
      x-required-feature:
        - admin.logs.tech.read
        - admin.logs.security.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - label
                - query
              properties:
                label:
                  type: string
                query:
                  $ref: '#/components/schemas/LogQuery'
      responses:
        '201':
          description: Requête sauvegardée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    $ref: '#/components/schemas/Id'
                  label:
                    type: string
                  query:
                    $ref: '#/components/schemas/LogQuery'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /logs/saved-queries/{queryId}:
    delete:
      tags:
        - logs
      operationId: deleteSavedLogQuery
      summary: Supprimer une requête de logs sauvegardée
      x-required-feature:
        - admin.logs.tech.read
        - admin.logs.security.read
      parameters:
        - name: queryId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '204':
          description: Supprimée.
        '403':
          $ref: '#/components/responses/Forbidden'
  /log-levels:
    get:
      tags:
        - logs
      operationId: listLogLevels
      summary: Niveaux de log actifs, dont les surcharges temporaires et leur expiration
      x-required-feature: admin.logs.level.change
      responses:
        '200':
          description: Niveaux.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogLevelOverride'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - logs
      operationId: overrideLogLevel
      summary: Activer temporairement un niveau (ex. DEBUG sur un module, une entité, un utilisateur) avec expiration
