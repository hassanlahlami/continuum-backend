components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ConnectorId:
      name: connectorId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    EntityQuery:
      name: entityId
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    Reason:
      name: reason
      in: query
      required: true
      description: Motif obligatoire (journalisé).
      schema:
        type: string
        minLength: 10
    ActionCode:
      name: actionCode
      in: path
      required: true
      description: Code d'une action disponible (voir availableActions).
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]*$
        example: submit-for-review
    Page:
      name: page
      in: query
      description: Numéro de page (commence à 0).
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Taille de page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 25
    From:
      name: from
      in: query
      description: Date de début (incluse).
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      description: Date de fin (incluse).
      schema:
        type: string
        format: date
  schemas:
    ConnectorInput:
      type: object
      required:
        - code
        - kind
        - endpoint
      properties:
        version:
          type: integer
        code:
          type: string
          example: amplitude-prod
        kind:
          type: string
          enum:
            - SOAP
            - REST
            - JDBC
            - EVENTS
        erpType:
          type: string
          example: AMPLITUDE
        endpoint:
          type: string
          example: http://amplitude.banque-demo.local:8080/amplitude/services/AccountService
        secretRef:
          type: string
          description: Chemin du secret dans Vault
          example: secret/continuum/amplitude-prod
        timeoutMs:
          type: integer
          example: 30000
        retry:
          type: object
          properties:
            maxAttempts:
              type: integer
              example: 3
            backoffMs:
              type: integer
              example: 1000
        entityId:
          $ref: '#/components/schemas/Id'
    Connector:
      allOf:
        - $ref: '#/components/schemas/ConnectorInput'
        - type: object
          required:
            - id
            - enabled
            - health
          properties:
            id:
              $ref: '#/components/schemas/Id'
            enabled:
              type: boolean
            health:
              type: string
              enum:
                - UP
                - DEGRADED
                - DOWN
                - UNKNOWN
            circuitBreaker:
              type: string
              enum:
                - CLOSED
                - OPEN
                - HALF_OPEN
            lastExecutionAt:
              type: string
              format: date-time
            lastTestResult:
              type: object
              properties:
                success:
                  type: boolean
                latencyMs:
                  type: integer
                message:
                  type: string
            availableActions:
              type: array
              items:
                $ref: '#/components/schemas/AvailableAction'
    ConnectorMapping:
      type: object
      required:
        - version
        - entities
      properties:
        version:
          type: integer
        entities:
          type: array
          items:
            type: object
            required:
              - canonicalEntity
              - fields
            properties:
              canonicalEntity:
                type: string
                description: Entité du modèle canonique **déclarée par le pack sectoriel** (voir getCanonicalModel) — ex. MOVEMENT en banque, ENGAGEMENT en établissement public (D35).
                example: MOVEMENT
              source:
                type: string
                example: AMPLITUDE.V_AUDIT_MOUVEMENTS
              fields:
                type: array
                items:
                  type: object
                  required:
                    - canonicalField
                    - sourceField
                  properties:
                    canonicalField:
                      type: string
                      example: enteredBy
                    sourceField:
                      type: string
                      example: UTILISATEUR_SAISIE
                    transform:
                      type: string
                      example: trim
    ConnectorExecutionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  at:
                    type: string
                    format: date-time
                  operation:
                    type: string
                    example: GetAccountList
                  outcome:
                    type: string
                    enum:
                      - SUCCESS
                      - RETRIED
                      - FAILED
                  durationMs:
                    type: integer
                  records:
                    type: integer
                  eventCode:
                    type: string
                    example: CTN-INT-0102
                  traceId:
                    type: string
    SignatureProvider:
      type: object
      required:
        - code
        - kind
        - maxLevel
      properties:
        id:
