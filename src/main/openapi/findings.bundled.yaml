openapi: 3.1.0
info:
  title: Continuum — Constats (FRAP)
  version: 0.1.0
  x-status: draft
  description: |
    Pages FND-01 à FND-05 : rédaction de la FRAP (fait, cause, conséquence, criticité, preuve), revue et validation (SoD : l'auteur ne valide pas), consolidation, vue transverse.
servers:
  - url: /api/app
security:
  - bearer: []
tags:
  - name: findings
paths:
  /missions/{missionId}/findings:
    parameters:
      - $ref: '#/components/parameters/MissionId'
    get:
      tags:
        - findings
      operationId: listMissionFindings
      summary: Constats de la mission
      x-required-feature: finding.read
      x-scope: mission
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - name: criticality
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Constats.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Finding'
    post:
      tags:
        - findings
      operationId: createFinding
      summary: Créer un constat (FRAP en brouillon), éventuellement à partir d'une vérification
      x-required-feature: finding.write
      x-scope: mission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindingInput'
      responses:
        '201':
          description: Constat créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Finding'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /missions/{missionId}/findings/{findingId}:
    parameters:
      - $ref: '#/components/parameters/MissionId'
      - $ref: '#/components/parameters/FindingId'
    get:
      tags:
        - findings
      operationId: getFinding
      summary: FRAP complète, avec statut, preuves, recommandations et actions disponibles
      x-required-feature: finding.read
      x-scope: mission
      responses:
        '200':
          description: Constat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Finding'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - findings
      operationId: updateFinding
      summary: Rédiger / modifier la FRAP (impossible une fois validée)
      x-required-feature: finding.write
      x-scope: mission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindingInput'
      responses:
        '200':
          description: Constat à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Finding'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /missions/{missionId}/findings/{findingId}/actions/{actionCode}:
    post:
      tags:
        - findings
      operationId: performFindingAction
      summary: Soumettre à la revue, demander des corrections, valider, écarter (SoD vérifiée par le serveur)
      x-required-feature: finding.read
      x-scope: object
      parameters:
        - $ref: '#/components/parameters/MissionId'
        - $ref: '#/components/parameters/FindingId'
        - $ref: '#/components/parameters/ActionCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: Constat à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Finding'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /missions/{missionId}/findings/{findingId}/history:
    get:
      tags:
        - findings
      operationId: getFindingHistory
      summary: Historique du constat (versions, commentaires de revue, validation)
      x-required-feature: finding.read
      x-scope: mission
      parameters:
        - $ref: '#/components/parameters/MissionId'
        - $ref: '#/components/parameters/FindingId'
      responses:
        '200':
          description: Historique.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryEntry'
  /missions/{missionId}/findings/{findingId}/evidences:
    post:
      tags:
        - findings
      operationId: attachFindingEvidence
      summary: Joindre une preuve (nouveau fichier ou document existant de la mission)
      x-required-feature: finding.write
      x-scope: mission
      parameters:
        - $ref: '#/components/parameters/MissionId'
        - $ref: '#/components/parameters/FindingId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/FileUpload'
          application/json:
            schema:
              type: object
              required:
                - documentId
              properties:
                documentId:
                  $ref: '#/components/schemas/Id'
      responses:
        '201':
          description: Preuve rattachée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '409':
          $ref: '#/components/responses/Conflict'
  /missions/{missionId}/findings-consolidation:
    parameters:
      - $ref: '#/components/parameters/MissionId'
    get:
      tags:
        - findings
      operationId: getFindingsConsolidation
      summary: Consolidation — regroupements, ordre de présentation, criticité finale
      x-required-feature: finding.consolidate
      x-scope: mission
      responses:
        '200':
          description: Consolidation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consolidation'
    put:
      tags:
        - findings
      operationId: updateFindingsConsolidation
      summary: Enregistrer la consolidation (fusion, ordre, criticité retenue et justification)
      x-required-feature: finding.consolidate
      x-scope: mission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Consolidation'
      responses:
        '200':
          description: Consolidation enregistrée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consolidation'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /findings:
    get:
      tags:
        - findings
      operationId: searchFindings
      summary: Vue transverse des constats (toutes missions du périmètre)
      x-required-feature: finding.read
      x-scope: unit
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/UnitId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: criticality
          in: query
          schema:
            type: string
        - name: riskFamilyCode
          in: query
          schema:
            type: string
        - name: source
          in: query
          schema:
            type: string
            enum:
              - MANUAL
              - CCM
      responses:
        '200':
          description: Constats paginés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingPage'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    MissionId:
      name: missionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    FindingId:
      name: findingId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    StatusFilter:
      name: status
      in: query
      description: Codes de statut (répétable).
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    ActionCode:
      name: actionCode
      in: path
      required: true
      description: Code d'une action disponible (voir availableActions).
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]*$
        example: submit-for-review
    Page:
      name: page
      in: query
      description: Numéro de page (commence à 0).
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Taille de page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 25
    Sort:
      name: sort
      in: query
      description: 'Tri : champ,asc|desc — répétable.'
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          example: updatedAt,desc
    Q:
      name: q
      in: query
      description: Recherche libre.
      schema:
        type: string
        maxLength: 200
    UnitId:
      name: unitId
      in: query
      description: Filtre sur une unité organisationnelle (et ses sous-unités si la portée le permet).
      schema:
        $ref: '#/components/schemas/Id'
    From:
      name: from
      in: query
      description: Date de début (incluse).
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      description: Date de fin (incluse).
      schema:
        type: string
        format: date
  schemas:
    FindingInput:
      type: object
      required:
        - title
      properties:
        version:
          type: integer
        title:
          type: string
          example: Virements validés par leur propre émetteur
        verificationId:
          $ref: '#/components/schemas/Id'
        riskId:
          $ref: '#/components/schemas/Id'
        fact:
          type: string
          description: Fait constaté
          example: 3 virements (98 000 MAD) saisis et validés par l'utilisateur U003 en septembre 2026.
        criterion:
          type: string
          description: Référentiel / règle attendue
          example: 'Procédure virements §4.2 : double validation obligatoire.'
        cause:
          type: string
          example: U003 cumule les habilitations de saisie et de validation depuis juillet 2024.
        consequence:
          type: string
          example: Risque de virement frauduleux non détecté.
        criticalityCode:
          type: string
          example: HIGH
        riskFamilyCode:
          type: string
          example: FRAUDE
        auditeeUnitId:
          $ref: '#/components/schemas/Id'
    Finding:
      allOf:
        - $ref: '#/components/schemas/FindingInput'
        - type: object
          required:
            - id
            - reference
            - status
            - meta
          properties:
            id:
              $ref: '#/components/schemas/Id'
            reference:
              type: string
              example: CST-2026-014-03
            missionId:
              $ref: '#/components/schemas/Id'
            missionTitle:
              type: string
            status:
              $ref: '#/components/schemas/Ref'
            criticality:
              $ref: '#/components/schemas/Ref'
            source:
              type: string
              enum:
                - MANUAL
                - CCM
            ccmExceptionId:
              $ref: '#/components/schemas/Id'
            author:
              $ref: '#/components/schemas/UserSummary'
            validatedBy:
              $ref: '#/components/schemas/UserSummary'
            validatedAt:
              type: string
              format: date-time
            evidences:
              type: array
              items:
                $ref: '#/components/schemas/Attachment'
            recommendationIds:
              type: array
              items:
                $ref: '#/components/schemas/Id'
            reviewComments:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    description: Champ de la FRAP commenté
                  comment:
                    type: string
                  author:
                    $ref: '#/components/schemas/UserSummary'
                  at:
                    type: string
                    format: date-time
                  resolved:
                    type: boolean
            locked:
              type: boolean
            availableActions:
              type: array
              items:
                $ref: '#/components/schemas/AvailableAction'
            meta:
              $ref: '#/components/schemas/AuditMeta'
    FindingPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Finding'
    Consolidation:
      type: object
      required:
        - version
        - groups
      properties:
        version:
          type: integer
        groups:
          type: array
          items:
            type: object
            required:
              - title
              - findingIds
            properties:
              title:
                type: string
                example: Séparation des tâches sur les virements
              order:
                type: integer
              findingIds:
                type: array
                items:
                  $ref: '#/components/schemas/Id'
              retainedCriticalityCode:
                type: string
              justification:
                type: string
                description: Obligatoire si la criticité retenue diffère de la criticité calculée
    Id:
      type: string
      format: uuid
      example: 3f6c2a1e-8b7d-4c21-9a55-0e2f4b6d8c10
    Ref:
      type: object
      description: Valeur d'un référentiel paramétrable par tenant (statut, criticité, type…).
      required:
        - code
        - label
      properties:
        code:
          type: string
          example: HIGH
        label:
          type: string
          description: Libellé dans la langue de l'utilisateur
          example: Élevée
        color:
          type: string
          description: Token de couleur sémantique (§1.6), jamais une couleur en dur
          example: criticality-high
    UserSummary:
      type: object
      required:
        - id
        - displayName
      properties:
        id:
          $ref: '#/components/schemas/Id'
        displayName:
          type: string
          example: Inspecteur Un
        positionLabel:
          type: string
          description: Position principale courante (libellé du tenant)
          example: Inspecteur
        unitLabel:
          type: string
          example: Département Inspection du Réseau
    Attachment:
      type: object
      required:
        - id
        - fileName
        - mediaType
        - size
        - sha256
        - uploadedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        fileName:
          type: string
          example: releve-comptes-A001.pdf
        mediaType:
          type: string
          example: application/pdf
        size:
          type: integer
          minimum: 0
          example: 184320
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        uploadedAt:
          type: string
          format: date-time
        uploadedBy:
          $ref: '#/components/schemas/UserSummary'
        category:
          $ref: '#/components/schemas/Ref'
    AvailableAction:
      type: object
      description: Action que l'utilisateur courant peut exécuter sur l'objet (calculée par le serveur).
      required:
        - code
        - label
      properties:
        code:
          type: string
          example: submit-for-review
        label:
          type: string
          example: Soumettre à la revue
        style:
          type: string
          enum:
            - primary
            - secondary
            - danger
          default: secondary
        requiresComment:
          type: boolean
          default: false
        requiresSignature:
          type: boolean
          default: false
        requiresStepUp:
          type: boolean
          default: false
          description: Authentification renforcée (acr=2) exigée
        confirmationMessage:
          type: string
          description: Message de confirmation à afficher avant exécution
    AuditMeta:
      type: object
      required:
        - createdAt
        - version
      properties:
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/UserSummary'
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          $ref: '#/components/schemas/UserSummary'
        version:
          type: integer
          minimum: 0
          description: Version pour l'écriture concurrente (409 si périmée)
          example: 3
    Problem:
      type: object
      description: Erreur RFC 9457 enrichie (contracts/README.md §6).
      required:
        - title
        - status
        - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          pattern: ^CTN-[A-Z]+-\d{4}$
          description: Code d'événement (§10.4)
        traceId:
          type: string
          description: Référence d'erreur affichée à l'utilisateur (§10.8)
        sodRule:
          type: string
          description: Règle SoD en cause (403 uniquement)
        errors:
          type: array
          items:
            type: object
            required:
              - field
              - code
              - message
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
    ActionRequest:
      type: object
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 0
        comment:
          type: string
          maxLength: 4000
        payload:
          type: object
          additionalProperties: true
          description: Données propres à l'action (ex. motif de refus, destinataires).
    HistoryEntry:
      type: object
      required:
        - at
        - actor
        - event
      properties:
        at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/UserSummary'
        event:
          $ref: '#/components/schemas/Ref'
        fromStatus:
          $ref: '#/components/schemas/Ref'
        toStatus:
          $ref: '#/components/schemas/Ref'
        comment:
          type: string
    FileUpload:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          contentEncoding: binary
        category:
          type: string
          description: Code de catégorie de pièce
        description:
          type: string
          maxLength: 500
    PageMeta:
      type: object
      required:
        - page
        - size
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
          minimum: 0
          example: 0
        size:
          type: integer
          minimum: 1
          example: 25
        totalItems:
          type: integer
          minimum: 0
          example: 42
        totalPages:
          type: integer
          minimum: 0
          example: 2
  responses:
    ValidationFailed:
      description: Données invalides — détail par champ dans errors[].
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://continuum.local/problems/validation
            title: Données invalides
            status: 422
            code: CTN-AUD-0422
            traceId: 7a1c2e9f0b3d4c5e8f9a0b1c2d3e4f50
            errors:
              - field: plannedEnd
                code: date.before-start
                message: La date de fin doit être postérieure à la date de début.
    NotFound:
      description: Ressource introuvable (ou hors de votre périmètre).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflit de version (l'objet a changé) ou état incompatible avec l'action.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Fonctionnalité non détenue sur cette portée, ou refus de séparation des tâches (code CTN-IAM-0210).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://continuum.local/problems/sod-violation
            title: Séparation des tâches
            status: 403
            detail: Vous avez rédigé ce constat ; sa validation doit être faite par une autre personne.
            code: CTN-IAM-0210
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            sodRule: NOT_CREATOR
