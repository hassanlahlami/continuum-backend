# Intégration continue du backend (plan §8). Gate : `mvn verify` avec une base PostgreSQL réelle
# (service) et les scripts du continuum-migrator (dépôt voisin, extrait en ../continuum-migrator).
# `-Dit.db.url` active DbSkipGuardListener : un test DB neutralisé en silence fait échouer le build.
# Oracle : job `oracle-nightly` séparé (cron + workflow_dispatch), image identique à Instructions/infra/simulation
# (gvenzl/oracle-free:23-slim-faststart). Le job par push reste PostgreSQL seul.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: continuum
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout continuum-migrator (sibling, as tests expect ../continuum-migrator)
        uses: actions/checkout@v4
        with:
          repository: hassanlahlami/continuum-migrator
          path: continuum-migrator
          token: ${{ secrets.MIGRATOR_READ_TOKEN || github.token }}
      - name: Move migrator next to the workspace
        run: mv continuum-migrator ../continuum-migrator
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & test (mvn verify)
        run: >-
          mvn -B -ntp verify
          -Dit.db.url=jdbc:postgresql://localhost:5433/continuum
          -Dit.db.user=postgres -Dit.db.password=pg

  oracle-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: oracle
          APP_USER: CONTINUUM
          APP_USER_PASSWORD: continuum
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 15s --health-timeout 10s --health-retries 20
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v4
      - name: Checkout continuum-migrator (sibling, as tests expect ../continuum-migrator)
        uses: actions/checkout@v4
        with:
          repository: hassanlahlami/continuum-migrator
          path: continuum-migrator
          token: ${{ secrets.MIGRATOR_READ_TOKEN || github.token }}
      - name: Move migrator next to the workspace
        run: mv continuum-migrator ../continuum-migrator
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # ADR 0012 : schéma partagé PLATFORM + compte entité, sans privilège ANY (script DBA du migrateur).
      - name: Provision PLATFORM and entity owners (DBA script of the migrator)
        run: >-
          docker exec -i -e PLATFORM_PASSWORD=dev-platform -e ENTITY_USER=CONTINUUM -e ENTITY_PASSWORD=continuum
          ${{ job.services.oracle.id }} bash -s < ../continuum-migrator/ops/oracle-provision.sh
      - name: Oracle parity tests
        run: >-
          mvn -B -ntp test -Dtest='Oracle*Test'
          -Dit.oracle.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
          -Dit.oracle.user=CONTINUUM -Dit.oracle.password=continuum
          -Dit.oracle.platform.user=PLATFORM -Dit.oracle.platform.password=dev-platform
